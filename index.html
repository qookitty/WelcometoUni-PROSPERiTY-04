<meta charset="UTF-8">

<style>
  :root{
    --font-scale:1;
    --pink:#ff8fab;
    --pink-light:#ffe3ec;
    --cream:#fff8f2;
    --brown:#7a5c48;
    --brown-dark:#5b4436;
    --green:#8bc34a;
    --blue:#7ec8e3;
    --yellow:#ffd166;
    --card:#ffffff;
    --shadow:0 8px 24px rgba(122,92,72,.12);
  }

  *{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
  }

  html{
    font-size:calc(16px * var(--font-scale));
  }

  body{
    margin:0;
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    background:

    color:var(--brown-dark);
    line-height:1.55;
  }

  .wrap{
    max-width:1080px;
    margin:0 auto;
    padding:18px 16px 40px;
  }

  header{
    text-align:center;
    background:linear-gradient(135deg,#ffd6e0,#fff1c9 55%,#d9f2ff);
    border-radius:26px;
    padding:26px 18px 22px;
    box-shadow:var(--shadow);
    margin-bottom:18px;
    position:relative;
    overflow:hidden;
  }

  header::before,
  header::after{
    content:"🍜";
    position:absolute;
    font-size:34px;
    opacity:.28;
  }

  header::before{left:16px;top:16px;transform:rotate(-12deg);}
  header::after{right:18px;bottom:14px;transform:rotate(14deg);}

  .badge{
    display:inline-block;
    background:#fff;
    color:var(--brown);
    font-size:.75rem;
    font-weight:700;
    padding:.31rem .75rem;
    border-radius:999px;
    box-shadow:0 3px 10px rgba(0,0,0,.07);
    margin-bottom:.63rem;
  }

  h1{
    margin:.25rem 0 .5rem;
    font-size:clamp(1.56rem,3.25vw,2.38rem);
    color:var(--brown-dark);
    letter-spacing:.5px;
  }

  .subtitle{
    margin:0;
    color:#7a6152;
    font-size:clamp(.81rem,2vw,1rem);
  }

  .info-row{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:.5rem;
    margin-top:.88rem;
  }

  .info-chip{
    background:rgba(255,255,255,.82);
    border-radius:999px;
    padding:.44rem .81rem;
    font-size:.78rem;
    font-weight:600;
    color:var(--brown-dark);
    box-shadow:0 3px 8px rgba(0,0,0,.06);
  }

  .font-control{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:.5rem;
    margin-top:.88rem;
    flex-wrap:wrap;
  }

  .font-btn{
    border:0;
    background:#fff;
    color:var(--brown-dark);
    font-weight:900;
    font-size:.9rem;
    border-radius:999px;
    padding:.5rem .9rem;
    cursor:pointer;
    box-shadow:0 3px 8px rgba(0,0,0,.08);
    transition:.15s;
  }

  .font-btn:hover{
    transform:translateY(-2px);
  }

  .font-label{
    background:rgba(255,255,255,.85);
    color:var(--brown-dark);
    font-weight:800;
    font-size:.78rem;
    border-radius:999px;
    padding:.44rem .81rem;
    box-shadow:0 3px 8px rgba(0,0,0,.06);
  }

  .quick{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:.63rem;
    margin-bottom:1rem;
  }

  .quick button{
    border:0;
    border-radius:18px;
    padding:.88rem .63rem;
    font-weight:800;
    font-size:.88rem;
    color:#fff;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:transform .15s ease, filter .15s ease;
  }

  .quick button:hover{
    transform:translateY(-2px);
    filter:brightness(1.04);
  }

  .quick .family{background:linear-gradient(135deg,#ff8fab,#ff6b8b);}
  .quick .fast{background:linear-gradient(135deg,#7ec8e3,#4aa8d8);}
  .quick .date{background:linear-gradient(135deg,#c3a1ff,#9b7bff);}
  .quick .heavy{background:linear-gradient(135deg,#ffb26b,#ff8a4c);}

  .filters{
    background:var(--card);
    border-radius:22px;
    padding:1rem;
    box-shadow:var(--shadow);
    margin-bottom:1rem;
  }

  .filter-title{
    font-weight:800;
    margin:0 0 .63rem;
    font-size:.94rem;
    display:flex;
    align-items:center;
    gap:.44rem;
  }

  .search-input{
    width:100%;
    border:2px solid #f1dcd0;
    border-radius:999px;
    padding:.81rem 1.13rem;
    font-size:.94rem;
    font-family:inherit;
    color:var(--brown-dark);
    background:#fff;
    outline:none;
    transition:.15s;
  }

  .search-input:focus{
    border-color:var(--pink);
    box-shadow:0 0 0 4px rgba(255,143,171,.18);
  }

  .search-input::placeholder{color:#b39a8b;}

  .chip-group{
    display:flex;
    flex-wrap:wrap;
    gap:.5rem;
  }

  .chip{
    border:2px solid #f1dcd0;
    background:#fff;
    color:var(--brown-dark);
    border-radius:999px;
    padding:.5rem .81rem;
    font-size:.81rem;
    font-weight:700;
    cursor:pointer;
    transition:.15s;
  }

  .chip:hover{border-color:var(--pink);}

  .chip.active{
    background:var(--pink);
    border-color:var(--pink);
    color:#fff;
    box-shadow:0 4px 12px rgba(255,143,171,.35);
  }

  .result-info{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:.63rem;
    margin:1.13rem .13rem .63rem;
    font-size:.84rem;
    font-weight:700;
    color:var(--brown);
  }

  .clear-btn{
    border:0;
    background:#fff;
    color:var(--brown);
    font-weight:800;
    border-radius:999px;
    padding:.44rem .81rem;
    cursor:pointer;
    box-shadow:0 3px 8px rgba(0,0,0,.08);
  }

  .cards{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(18.13rem,1fr));
    gap:.88rem;
  }

  .card{
    background:var(--card);
    border-radius:22px;
    padding:1rem;
    box-shadow:var(--shadow);
    border:2px solid transparent;
    transition:.18s;
    position:relative;
  }

  .card:hover{
    transform:translateY(-3px);
    border-color:var(--pink-light);
  }

  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:.63rem;
  }

  .floor{
    flex:0 0 auto;
    background:var(--pink-light);
    color:var(--brown);
    font-size:.75rem;
    font-weight:900;
    padding:.38rem .63rem;
    border-radius:999px;
  }

  .heart{
    border:0;
    background:#fff0f5;
    color:#ff5c8a;
    width:2.38rem;
    height:2.38rem;
    border-radius:50%;
    font-size:1.13rem;
    cursor:pointer;
    box-shadow:0 3px 8px rgba(0,0,0,.07);
    transition:.15s;
  }

  .heart.saved{
    background:#ff5c8a;
    color:#fff;
  }

  h2{
    margin:.63rem 0 .38rem;
    font-size:1.19rem;
    color:var(--brown-dark);
  }

  .rating{
    display:flex;
    align-items:center;
    gap:.38rem;
    margin:0 0 .63rem;
    font-size:.84rem;
    font-weight:800;
    color:#a8763a;
  }

  .stars{
    color:#ffb703;
    letter-spacing:1px;
    font-size:.94rem;
  }

  .review-count{
    font-size:.75rem;
    font-weight:600;
    color:#8a7161;
  }

  .tags{
    display:flex;
    flex-wrap:wrap;
    gap:.38rem;
    margin-bottom:.63rem;
  }

  .tag{
    font-size:.72rem;
    font-weight:700;
    border-radius:999px;
    padding:.25rem .56rem;
    background:#f7f2ec;
    color:var(--brown);
  }

  .desc{
    font-size:.88rem;
    color:#6d584c;
    margin:0 0 .63rem;
  }

  .more{

    max-height:0;
    transition:max-height .25s ease;
  }

  .card.open .more{max-height:1200px;}

  .more-box{
    background:#fff8f2;
    border-radius:16px;
    padding:.75rem;
    margin-top:.5rem;
    font-size:.84rem;
  }

  .more-box b{color:var(--brown-dark);}

  .social-title{
    margin:.63rem 0 .44rem;
    font-weight:800;
    font-size:.81rem;
    color:var(--brown-dark);
  }

  .social-links{
    display:flex;
    flex-wrap:wrap;
    gap:.44rem;
  }

  .social-link{
    display:inline-flex;
    align-items:center;
    gap:.31rem;
    border-radius:999px;
    padding:.44rem .69rem;
    font-size:.75rem;
    font-weight:800;
    text-decoration:none;
    color:#fff;

    gap:.5rem;
    margin-top:.75rem;

  .btn{

    text-align:center;
    border:0;
    border-radius:999px;
    padding:.63rem .75rem;
    font-weight:800;
    font-size:.81rem;

    display:block;

  footer{
    margin-top:1.5rem;
    text-align:center;
    color:#8a7161;
    font-size:.78rem;
    background:#fff;
    border-radius:18px;
    padding:.88rem;
    box-shadow:var(--shadow);
  }

  footer b{color:var(--brown-dark);}

  @media(min-width:700px){
    .quick{grid-template-columns:repeat(4,1fr);}
    .wrap{padding:1.63rem 1.38rem 3.13rem;}
    .card{padding:1.13rem;}
  }
</style>
</head>

  <section class="filters">

      <button class="chip" data-type="速食">速食</button>
      <button class="chip" data-type="點心">點心</button>
    </div>
  </section>

  <div class="result-info">
    <span id="resultCount">共 9 家餐飲店家</span>
    <button class="clear-btn" onclick="clearFilters()">清除篩選</button>
  </div>

  <main class="cards" id="cards"></main>

  <div class="empty" id="emptyBox" style="display:none;">
    <span>🥺</span>

    試著切換樓層、料理類型或搜尋關鍵字吧！

  <footer>

    資料主要整理自新營萬家福（原新營家樂福）健康路 251 號的館內餐飲資訊。
  </footer>
</div>

  }
];

const cards = document.getElementById("cards");
const emptyBox = document.getElementById("emptyBox");
const resultCount = document.getElementById("resultCount");
const fontLabel = document.getElementById("fontLabel");

let activeFloor = "all";
let activeType = "all";
let activeScene = "";
let fontScale = 1;

function makeStars(score){
  let stars = "";

  for(let i = 1; i <= 5; i++){
    if(score >= i){
      stars += "★";
    }else if(score >= i - 0.5){
      stars += "⯨";
    }else{
      stars += "☆";
    }
  }

  return stars;
}

function makeSocialLinks(r){
  let links = "";

  if(r.website){
    links += `
      <a class="social-link website" href="${r.website}" target="_blank" rel="noopener">
        🌐 官方網站
      </a>
    `;
  }else{
    links += `<span class="social-link none">🌐 暫無公開官網</span>`;
  }

  if(r.facebook){
    links += `
      <a class="social-link facebook" href="${r.facebook}" target="_blank" rel="noopener">
        📘 Facebook
      </a>
    `;
  }else{
    links += `<span class="social-link none">📘 暫無公開 FB</span>`;
  }

  if(r.instagram){
    links += `
      <a class="social-link instagram" href="${r.instagram}" target="_blank" rel="noopener">
        📸 Instagram
      </a>
    `;
  }else{
    links += `<span class="social-link none">📸 暫無公開 IG</span>`;
  }

  return links;
}

function makeCard(r){
  const tags = r.type.map(t=>`<span class="tag">${t}</span>`).join("");
  const stars = makeStars(r.rating);
  const socialLinks = makeSocialLinks(r);

  const phoneBtn = r.phone
    ? `<a class="btn btn-phone" href="tel:${r.phone}">📞 打電話</a>`
    : `<a class="btn btn-phone" href="#" onclick="alert('此店家電話請以現場公告為準');return false;">📞 電話資訊</a>`;

  return `
    <article
      class="card"
      data-floor="${r.floor}"
      data-type="${r.type.join(',')}"
      data-scene="${r.scene.join(',')}"
      data-search="${r.name} ${r.type.join(' ')} ${r.short} ${r.detail}"
    >
      <div class="card-top">
        <span class="floor">${r.floor}</span>
        <button
          class="heart"
          onclick="toggleSave(this,'${r.name}')"
          title="加入想吃清單"
        >🤍</button>
      </div>

      <h2>${r.emoji} ${r.name}</h2>

      <div class="rating">
        <span class="stars">${stars}</span>
        <span>${r.rating.toFixed(1)}</span>
        <span class="review-count">（${r.reviews} 則評論）</span>
      </div>

      <div class="tags">${tags}</div>
      <p class="desc">${r.short}</p>

      <div class="more">
        <div class="more-box">
          ${r.detail}

          <p class="social-title">🔗 官方與社群資訊</p>
          <div class="social-links">
            ${socialLinks}
          </div>
        </div>
      </div>

      <div class="card-actions">
        <button class="btn btn-detail" onclick="toggleCard(this)">📖 看更多</button>
        <a
          class="btn btn-map"
          target="_blank"
          rel="noopener"
          href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.map)}"
        >🗺️ 導航</a>
        ${phoneBtn}
      </div>
    </article>
  `;
}

cards.innerHTML = restaurants.map(makeCard).join("");

function render(){
  const keyword = document
    .getElementById("searchInput")
    .value
    .trim()
    .toLowerCase();

  const all = [...cards.children];
  let visible = 0;

  all.forEach(card=>{
    const floor = card.dataset.floor;
    const types = card.dataset.type.split(",");
    const scenes = card.dataset.scene.split(",");
    const searchable = card.dataset.search.toLowerCase();

    const showFloor = activeFloor === "all" || floor === activeFloor;
    const showType = activeType === "all" || types.includes(activeType);
    const showScene = !activeScene || scenes.includes(activeScene);
    const showKeyword = !keyword || searchable.includes(keyword);

    const show = showFloor && showType && showScene && showKeyword;

    card.style.display = show ? "" : "none";

    if(show){
      visible++;
    }
  });

  resultCount.textContent = `符合條件：${visible} 家`;
  emptyBox.style.display = visible ? "none" : "";
}

document.querySelectorAll("#floorFilters .chip").forEach(btn=>{
  btn.onclick = ()=>{
    document
      .querySelectorAll("#floorFilters .chip")
      .forEach(b=>b.classList.remove("active"));

    btn.classList.add("active");
    activeFloor = btn.dataset.floor;
    render();
  };
});

document.querySelectorAll("#typeFilters .chip").forEach(btn=>{
  btn.onclick = ()=>{
    document
      .querySelectorAll("#typeFilters .chip")
      .forEach(b=>b.classList.remove("active"));

    btn.classList.add("active");
    activeType = btn.dataset.type;
    render();
  };
});

function applyScene(scene){
  activeScene = activeScene === scene ? "" : scene;
  render();
}

function clearFilters(){
  activeFloor = "all";
  activeType = "all";
  activeScene = "";

  document.getElementById("searchInput").value = "";

  document.querySelectorAll(".chip").forEach(b=>b.classList.remove("active"));
  document
    .querySelector('#floorFilters .chip[data-floor="all"]')
    .classList.add("active");

  document
    .querySelector('#typeFilters .chip[data-type="all"]')
    .classList.add("active");

  render();
}

function toggleCard(btn){
  const card = btn.closest(".card");
  card.classList.toggle("open");

  btn.textContent = card.classList.contains("open")
    ? "🔼 收起說明"
    : "📖 看更多";
}

function toggleSave(btn,name){
  btn.classList.toggle("saved");
  btn.textContent = btn.classList.contains("saved") ? "❤️" : "🤍";

  const saved = JSON.parse(
    localStorage.getItem("wanjiafuSaved") || "[]"
  );

  if(btn.classList.contains("saved")){
    if(!saved.includes(name)){
      saved.push(name);
    }
  }else{
    const index = saved.indexOf(name);

    if(index > -1){
      saved.splice(index,1);
    }
  }

  localStorage.setItem("wanjiafuSaved", JSON.stringify(saved));
}

function updateFontDisplay(){
  fontLabel.textContent = `字體大小：${Math.round(fontScale * 100)}%`;
}

function changeFont(step){
  fontScale = Math.min(1.5, Math.max(0.8, fontScale + step));

  document.documentElement.style.setProperty(
    "--font-scale",
    fontScale
  );

  localStorage.setItem("wanjiafuFontScale", fontScale);
  updateFontDisplay();
}

function resetFont(){
  fontScale = 1;

  document.documentElement.style.setProperty(
    "--font-scale",
    fontScale
  );

  localStorage.setItem("wanjiafuFontScale", fontScale);
  updateFontDisplay();
}

(function restoreFont(){
  const savedFont = parseFloat(
    localStorage.getItem("wanjiafuFontScale")
  );

  if(!isNaN(savedFont)){
    fontScale = Math.min(1.5, Math.max(0.8, savedFont));

    document.documentElement.style.setProperty(
      "--font-scale",
      fontScale
    );
  }

  updateFontDisplay();
})();

(function restoreSaved(){
  const saved = JSON.parse(
    localStorage.getItem("wanjiafuSaved") || "[]"
  );

  document.querySelectorAll(".card").forEach(card=>{
    const name = card
      .querySelector("h2")
      .textContent
      .replace(/^[^\s]+\s/,"");

    if(saved.includes(name)){
      const heart = card.querySelector(".heart");
      heart.classList.add("saved");
      heart.textContent = "❤️";
    }
  });
})();

render();
</script>
</body>
</html>
